<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planned | To-Do App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="d-flex min-vh-100">
        <nav class="sidebar bg-light p-3">
            <h2 class="mb-4">To Do</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/myday">My Day</a></li>
                <li class="nav-item"><a class="nav-link active" href="/planned">Planned</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Tasks</a></li>
            </ul>
            <div class="mt-auto">
                <button class="btn btn-outline-dark w-100" id="darkModeToggle">Dark Mode</button>
            </div>
        </nav>
        <div class="flex-grow-1 p-4">
            <h3>Planned</h3>
            <div id="taskList" class="row g-3">
                {% for task in tasks %}
                <div class="col-12">
                    <div class="task-card">
                        <input type="checkbox" class="form-check-input me-2" {% if task[2] %}checked{% endif %}>
                        <div class="flex-grow-1">
                            <div class="task-title {% if task[2] %}completed{% endif %}">{{ task[1] }}</div>
                            <div class="task-meta">Due: {{ task[5] or 'N/A' }} | Priority: {{ task[6] or 'None' }} | List: {{ task[7] or 'Tasks' }}</div>
                        </div>
                        <button class="delete-btn ms-2">Delete</button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
