<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern To-Do App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <nav class="sidebar bg-light p-3">
            <h2 class="mb-4">To Do</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link {% if page=='My Day' %}active{% endif %}" href="/myday">My Day</a></li>
                <li class="nav-item"><a class="nav-link {% if page=='Planned' %}active{% endif %}" href="/planned">Planned</a></li>
                <li class="nav-item"><a class="nav-link {% if page=='Tasks' %}active{% endif %}" href="/">Tasks</a></li>
            </ul>
            <div class="mt-auto">
                <button class="btn btn-outline-dark w-100" id="darkModeToggle">Dark Mode</button>
            </div>
        </nav>
        <!-- Main Content -->
        <div class="flex-grow-1 p-4 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh;">
            <div class="text-center bg-white rounded-4 shadow-lg p-5" style="max-width: 480px;">
                <img src="https://img.icons8.com/color/96/000000/todo-list.png" alt="To-Do Icon" class="mb-4">
                <h1 class="mb-3" style="color:#0078d4; font-weight:700;">Welcome to Your To-Do App</h1>
                <p class="mb-4" style="color:#607d8b; font-size:1.1rem;">Organize your day, plan ahead, and manage everything in one place with a beautiful, modern interface.</p>
                <button class="btn btn-success btn-lg mb-3 w-100" data-bs-toggle="modal" data-bs-target="#addTaskModal">Add Task</button>
                <a href="/myday" class="btn btn-primary btn-lg mb-2 w-100">Go to My Day</a>
                <a href="/planned" class="btn btn-info btn-lg mb-2 w-100">See Planned Tasks</a>
                <a href="/" class="btn btn-outline-dark btn-lg w-100">All Tasks</a>
                        <!-- Add Task Modal -->
                        <div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="addTaskModalLabel">Add Task</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <input type="text" class="form-control mb-2" id="taskTitle" placeholder="Task title">
                                        <input type="date" class="form-control mb-2" id="taskDueDate">
                                        <select class="form-select mb-2" id="taskPriority">
                                            <option value="">Priority</option>
                                            <option value="High">High</option>
                                            <option value="Medium">Medium</option>
                                            <option value="Low">Low</option>
                                        </select>

                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                        <button type="button" class="btn btn-success" id="addTaskBtn">Add Task</button>
                                    </div>
                                </div>
                            </div>
                        </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
